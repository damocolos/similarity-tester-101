<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>String Similarity // Monge-Elkan</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --sky: #5cc8f2;
      --sky-light: #8ee0fa;
      --red: #e63946;
      --red-dark: #b71c2a;
      --yellow: #ffd43b;
      --yellow-dark: #d9a900;
      --green: #4caf50;
      --green-dark: #2e7d32;
      --brown: #7b451e;
      --brown-dark: #542d13;
      --cream: #fff8dc;
      --white: #ffffff;
      --dark: #38220f;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;

      background:
        linear-gradient(
          to bottom,
          var(--sky-light) 0%,
          var(--sky) 65%,
          #9bdd6c 65%,
          #73c653 100%
        );

      color: var(--dark);
      font-family: "Courier New", monospace;
    }

    /* Decorative clouds */
    body::before,
    body::after {
      content: "";
      position: fixed;
      z-index: -1;
      width: 140px;
      height: 45px;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 50px;
      box-shadow:
        35px -15px 0 rgba(255, 255, 255, 0.85),
        70px 0 0 rgba(255, 255, 255, 0.85);
    }

    body::before {
      top: 10%;
      left: 5%;
    }

    body::after {
      top: 22%;
      right: 5%;
      transform: scale(0.75);
    }

    .container {
      width: 100%;
      max-width: 760px;
      margin: 30px auto;
    }

    .terminal {
      position: relative;

      padding: 28px;

      background: var(--cream);

      border: 5px solid var(--dark);
      border-radius: 18px;

      box-shadow:
        0 8px 0 var(--brown-dark),
        0 14px 25px rgba(60, 30, 0, 0.25);
    }

    h1 {
      margin: 0 0 8px;

      color: var(--red);

      font-size: clamp(24px, 6vw, 38px);
      font-weight: 900;
      text-align: center;
      letter-spacing: 1px;

      text-shadow:
        2px 2px 0 var(--dark);
    }

    .subtitle {
      margin-bottom: 30px;

      color: var(--brown);

      font-size: 13px;
      font-weight: bold;
      text-align: center;
      letter-spacing: 1px;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;

      color: var(--brown);

      font-weight: 900;
      font-size: 15px;
    }

    textarea {
      width: 100%;
      min-height: 100px;

      resize: vertical;

      padding: 14px;

      background: var(--white);
      color: var(--dark);

      border: 4px solid var(--brown);
      border-radius: 10px;

      outline: none;

      font: inherit;
      font-size: 15px;

      box-shadow: 0 4px 0 var(--brown-dark);
    }

    textarea::placeholder {
      color: #a58d78;
    }

    textarea:focus {
      border-color: var(--red);
      box-shadow: 0 4px 0 var(--red-dark);
    }

    button {
      width: 100%;

      padding: 15px;
      margin-top: 5px;

      background: var(--red);
      color: var(--white);

      border: 4px solid var(--red-dark);
      border-radius: 10px;

      font: inherit;
      font-weight: 900;

      cursor: pointer;

      text-transform: uppercase;

      box-shadow: 0 5px 0 var(--red-dark);

      transition:
        transform 0.08s ease,
        box-shadow 0.08s ease;
    }

    button:hover {
      background: #f04a56;
    }

    button:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 var(--red-dark);
    }

    .result {
      margin-top: 32px;
      padding: 24px;

      background: var(--yellow);

      border: 5px solid var(--brown);
      border-radius: 14px;

      text-align: center;

      box-shadow: 0 5px 0 var(--brown-dark);
    }

    .result-label {
      margin-bottom: 10px;

      color: var(--brown);

      font-size: 14px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .score {
      color: var(--red);

      font-size: clamp(48px, 14vw, 90px);
      font-weight: 900;
      line-height: 1;

      text-shadow:
        3px 3px 0 var(--white),
        5px 5px 0 var(--brown);
    }

    .score-max {
      color: var(--brown);

      font-size: 20px;
      font-weight: bold;
    }

    .status {
      display: inline-block;

      margin-top: 18px;
      padding: 7px 14px;

      background: var(--green);
      color: var(--white);

      border: 3px solid var(--green-dark);
      border-radius: 8px;

      font-weight: 900;
      letter-spacing: 1px;

      box-shadow: 0 3px 0 var(--green-dark);
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      .container {
        margin: 12px auto;
      }

      .terminal {
        padding: 18px;
        border-width: 4px;
      }

      textarea {
        min-height: 80px;
      }

      .result {
        padding: 20px 12px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <section class="terminal">

      <h1>STRING SIMILARITY</h1>

      <div class="subtitle">
        ★ MONGE-ELKAN COMPARATOR ★
      </div>

      <div class="field">
        <label for="stringA">🍄 INPUT A</label>

        <textarea
          id="stringA"
          placeholder="Enter first string..."
        ></textarea>
      </div>

      <div class="field">
        <label for="stringB">⭐ INPUT B</label>

        <textarea
          id="stringB"
          placeholder="Enter second string..."
        ></textarea>
      </div>

      <button id="compare">
        ▶ RUN COMPARISON
      </button>

      <div class="result">
        <div class="result-label">
          MATCH SCORE
        </div>

        <div>
          <span id="score" class="score">--</span>
          <span class="score-max">/ 100</span>
        </div>

        <div id="status" class="status">
          READY!
        </div>
      </div>

    </section>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
